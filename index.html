<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沉浸阅读器</title>
<style>
/* ========== CSS 变量 & 主题 ========== */
:root {
  --bg-primary: #F5F0E8;
  --bg-secondary: #EDE8DC;
  --text-primary: #2C2C2C;
  --text-secondary: #666;
  --text-muted: #999;
  --border-color: rgba(0,0,0,0.08);
  --accent: #8B7355;
  --accent-hover: #A0896A;
  --highlight: #FFEB3B;
  --highlight-current: #FF9800;
  --shadow: rgba(0,0,0,0.12);
  --overlay: rgba(0,0,0,0.4);
  --navbar-bg: rgba(245,240,232,0.85);
  --sidebar-width: 320px;
  --topbar-height: 40px;
  --bottombar-height: 32px;
  --page-max-width: 720px;
  --font-size: 18px;
  --line-height: 1.8;
  --font-family: '宋体', SimSun, serif;
  --content-width: 680px;
  --layout-side: left;
}

.night-mode {
  --bg-primary: #1A1A1A;
  --bg-secondary: #242424;
  --text-primary: #D4C5A0;
  --text-secondary: #A89870;
  --text-muted: #776B55;
  --border-color: rgba(255,255,255,0.06);
  --accent: #C4A96A;
  --accent-hover: #D4BA7A;
  --navbar-bg: rgba(26,26,26,0.9);
  --shadow: rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

/* ========== 全局重置 ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: var(--font-family);
  font-size: var(--font-size);
  line-height: var(--line-height);
  color: var(--text-primary);
  background: var(--bg-primary);
  transition: background 0.3s, color 0.3s;
  user-select: text;
  -webkit-user-select: text;
}

/* ========== 顶部导航栏 ========== */
.topbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--topbar-height);
  background: var(--navbar-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center;
  padding: 0 12px;
  z-index: 100;
  transition: transform 0.3s, opacity 0.3s;
}
.topbar.hidden { transform: translateY(-100%); opacity: 0; pointer-events: none; }
.topbar-left, .topbar-center, .topbar-right {
  display: flex; align-items: center; gap: 4px;
}
.topbar-left { flex: 1; justify-content: flex-start; }
.topbar-center { flex: 0 0 auto; }
.topbar-right { 
  flex: 1; 
  justify-content: flex-end; 
  /* 修复移动端三点菜单：确保按钮不被裁剪 */
  overflow: visible;
  position: relative;
}

/* ========== 图标按钮 ========== */
.icon-btn {
  width: 32px; height: 32px;
  border: none; background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
  transition: background 0.2s, color 0.2s;
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--border-color); color: var(--text-primary); }
.icon-btn.active { color: var(--accent); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ========== 文件名显示 ========== */
.file-name {
  font-size: 13px; color: var(--text-muted);
  max-width: 300px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
  padding: 0 8px;
}

/* ========== 搜索栏 ========== */
.search-bar {
  position: fixed; top: var(--topbar-height); left: 0; right: 0;
  height: 44px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center;
  padding: 0 12px; gap: 8px;
  z-index: 99;
  transform: translateY(-100%); opacity: 0;
  transition: transform 0.25s, opacity 0.25s;
}
.search-bar.visible { transform: translateY(0); opacity: 1; }
.search-bar input {
  flex: 1; height: 30px;
  border: 1px solid var(--border-color);
  border-radius: 4px;
  padding: 0 10px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  outline: none;
}
.search-bar input:focus { border-color: var(--accent); }
.search-bar .search-info {
  font-size: 12px; color: var(--text-muted);
  white-space: nowrap; min-width: 80px; text-align: center;
}
.search-bar .search-options { display: flex; gap: 4px; }
.search-bar .search-options label {
  font-size: 12px; color: var(--text-secondary);
  display: flex; align-items: center; gap: 2px; cursor: pointer;
}
.search-bar .search-options input[type="checkbox"] { margin: 0; cursor: pointer; }

/* ========== 主阅读区 ========== */
.reader-container {
  position: fixed;
  top: var(--topbar-height);
  left: 0; right: 0;
  bottom: var(--bottombar-height);
  overflow: hidden;
  transition: top 0.3s;
}
.reader-container.fullscreen-mode {
  top: 0;
  bottom: 0;
}

/* 阅读内容区 */
.reader-content {
  width: 100%; 
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex; 
  justify-content: center;
  align-items: flex-start;
  padding: 24px 0;
  box-sizing: border-box;
  scroll-behavior: smooth;
}
.reader-content::-webkit-scrollbar { width: 6px; }
.reader-content::-webkit-scrollbar-track { background: transparent; }
.reader-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
.reader-content::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

.content-wrapper {
  width: var(--content-width);
  max-width: 90vw;
  min-height: 100%;
  padding: 20px 0;
  position: relative;
}

/* 分页模式 */
.content-wrapper.page-mode {
  overflow: hidden;
}
.content-wrapper.page-mode .page-content {
  display: none;
}
.content-wrapper.page-mode .page-content.active {
  display: block;
}

/* 滚动模式 */
.content-wrapper.scroll-mode .page-content {
  display: block !important;
  margin-bottom: 0;
}

/* 文本段落样式 */
.page-content p,
.page-content .para {
  text-indent: 2em;
  margin-bottom: 0.5em;
  word-break: break-all;
  word-wrap: break-word;
}

/* 搜索高亮 */
.search-highlight { background: var(--highlight); border-radius: 2px; padding: 0 1px; }
.search-highlight.current { background: var(--highlight-current); }

/* ========== 底部状态栏 ========== */
.bottombar {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--bottombar-height);
  background: var(--navbar-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--border-color);
  display: flex; align-items: center; justify-content: center;
  gap: 16px;
  font-size: 12px; color: var(--text-muted);
  z-index: 100;
  transition: transform 0.3s, opacity 0.3s;
}
.bottombar.hidden { transform: translateY(100%); opacity: 0; pointer-events: none; }

/* ========== 侧边栏 ========== */
.sidebar-overlay {
  position: fixed; inset: 0;
  background: var(--overlay);
  z-index: 200;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
}
.sidebar-overlay.visible { opacity: 1; pointer-events: auto; }

.sidebar {
  position: fixed; top: 0; bottom: 0;
  width: var(--sidebar-width);
  max-width: 85vw;
  background: var(--bg-primary);
  z-index: 201;
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex; flex-direction: column;
  box-shadow: 4px 0 20px var(--shadow);
}
.sidebar.right-layout {
  right: 0; left: auto;
  transform: translateX(100%);
  box-shadow: -4px 0 20px var(--shadow);
}
.sidebar.visible { transform: translateX(0); }

.sidebar-header {
  height: var(--topbar-height);
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid var(--border-color);
  flex-shrink: 0;
}
.sidebar-header h3 {
  font-size: 15px; font-weight: 600;
  color: var(--text-primary);
}
.sidebar-body {
  flex: 1; overflow-y: auto;
  padding: 12px;
}
.sidebar-body::-webkit-scrollbar { width: 4px; }
.sidebar-body::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

/* ========== 目录项 ========== */
.toc-item {
  padding: 8px 12px;
  font-size: 14px;
  color: var(--text-secondary);
  cursor: pointer;
  border-radius: 6px;
  transition: background 0.2s;
  display: flex; align-items: center; gap: 8px;
}
.toc-item:hover { background: var(--border-color); }
.toc-item.current { color: var(--accent); background: rgba(139,115,85,0.1); font-weight: 600; }
.toc-item .toc-level { color: var(--text-muted); font-size: 12px; flex-shrink: 0; }
.toc-item.indent-1 { padding-left: 28px; }
.toc-item.indent-2 { padding-left: 44px; }

/* ========== 书签项 ========== */
.bookmark-item {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-color);
  cursor: pointer;
  transition: background 0.2s;
}
.bookmark-item:hover { background: var(--border-color); }
.bookmark-item .bm-name {
  font-size: 14px; color: var(--text-primary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.bookmark-item .bm-meta {
  font-size: 12px; color: var(--text-muted); margin-top: 4px;
  display: flex; gap: 12px;
}
.bookmark-item .bm-delete {
  float: right; border: none; background: transparent;
  color: var(--text-muted); cursor: pointer; font-size: 16px;
  padding: 2px 4px; border-radius: 4px;
}
.bookmark-item .bm-delete:hover { color: #E53935; background: rgba(229,57,53,0.1); }

/* ========== 书架项 ========== */
.bookshelf-item {
  padding: 12px;
  border-bottom: 1px solid var(--border-color);
  cursor: pointer;
  transition: background 0.2s;
  position: relative;
  overflow: hidden;
}
.bookshelf-item:hover { background: var(--border-color); }
.bookshelf-item .bs-name {
  font-size: 14px; color: var(--text-primary); font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.bookshelf-item .bs-meta {
  font-size: 12px; color: var(--text-muted); margin-top: 4px;
  display: flex; gap: 12px;
}
.bookshelf-item .bs-progress {
  margin-top: 6px; height: 3px;
  background: var(--border-color); border-radius: 2px;
  overflow: hidden;
}
.bookshelf-item .bs-progress-bar {
  height: 100%; background: var(--accent); border-radius: 2px;
  transition: width 0.3s;
}
.bookshelf-item .bs-delete {
  position: absolute; right: -60px; top: 0; bottom: 0;
  width: 60px; background: #E53935; color: #fff;
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; transition: right 0.3s;
}
.bookshelf-item.swiped .bs-delete { right: 0; }

/* ========== 设置面板 ========== */
.settings-panel {
  position: fixed;
  top: var(--topbar-height);
  bottom: var(--bottombar-height);
  width: 340px;
  max-width: 90vw;
  background: var(--bg-primary);
  z-index: 150;
  border: 1px solid var(--border-color);
  overflow-y: auto;
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 4px 0 20px var(--shadow);
}
.settings-panel.right-layout {
  right: 0; left: auto;
  transform: translateX(100%);
  box-shadow: -4px 0 20px var(--shadow);
}
.settings-panel.visible { transform: translateX(0); }

.settings-section {
  padding: 16px;
  border-bottom: 1px solid var(--border-color);
}
.settings-section h4 {
  font-size: 13px; font-weight: 600;
  color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 12px;
}
.setting-row {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.setting-row label {
  font-size: 14px; color: var(--text-secondary);
}
.setting-row input[type="range"] {
  width: 140px; height: 4px;
  -webkit-appearance: none; appearance: none;
  background: var(--border-color); border-radius: 2px;
  outline: none;
}
.setting-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}
.setting-row select, .setting-row input[type="number"] {
  height: 30px; padding: 0 8px;
  border: 1px solid var(--border-color);
  border-radius: 4px;
  background: var(--bg-secondary);
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
}
.setting-row select:focus, .setting-row input[type="number"]:focus {
  border-color: var(--accent);
}

/* 【新增】颜色预设色块通用样式 */
.color-presets {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
}
.color-preset {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 2.5px solid transparent;
  cursor: pointer;
  transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  flex-shrink: 0;
}
.color-preset:hover { transform: scale(1.15); box-shadow: 0 2px 8px var(--shadow); }
.color-preset.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(139,115,85,0.3); }

/* 【新增】自定义取色器样式 */
.color-picker-row {
  display: flex; align-items: center; gap: 8px; margin-top: 10px;
}
.color-picker-row label {
  font-size: 13px; color: var(--text-secondary); white-space: nowrap;
}
.color-picker-row input[type="color"] {
  width: 36px; height: 28px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  cursor: pointer;
  padding: 2px;
  background: var(--bg-secondary);
}

/* 【新增】透明度滑块带刻度 */
.opacity-slider-wrap {
  margin-top: 10px;
}
.opacity-slider-wrap .slider-labels {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--text-muted);
  margin-bottom: 4px; padding: 0 2px;
}
.opacity-slider-wrap input[type="range"] {
  width: 100%; height: 4px;
  -webkit-appearance: none; appearance: none;
  background: linear-gradient(to right, rgba(255,255,255,0.9), var(--accent));
  border-radius: 2px; outline: none;
}
.opacity-slider-wrap input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  box-shadow: 0 1px 4px var(--shadow);
}

/* 【兼容保留】旧背景预设色块样式（已由 .color-preset 替代） */
.bg-presets {
  display: flex; gap: 8px; flex-wrap: wrap;
}
.bg-preset {
  width: 36px; height: 36px;
  border-radius: 8px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: border-color 0.2s, transform 0.2s;
}
.bg-preset:hover { transform: scale(1.1); }
.bg-preset.active { border-color: var(--accent); }

/* 布局单选 */
.layout-options { display: flex; gap: 8px; }
.layout-option {
  flex: 1; padding: 8px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  text-align: center; cursor: pointer;
  font-size: 13px; color: var(--text-secondary);
  transition: all 0.2s;
}
.layout-option:hover { border-color: var(--accent); }
.layout-option.active {
  border-color: var(--accent);
  background: rgba(139,115,85,0.1);
  color: var(--accent);
}

/* ========== 欢迎页 ========== */
.welcome-screen {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%; color: var(--text-muted);
  text-align: center; padding: 40px;
}
.welcome-screen svg { width: 80px; height: 80px; stroke: var(--text-muted); fill: none; stroke-width: 1; margin-bottom: 20px; opacity: 0.5; }
.welcome-screen h2 { font-size: 22px; font-weight: 400; margin-bottom: 8px; color: var(--text-secondary); }
.welcome-screen p { font-size: 14px; margin-bottom: 24px; }
.welcome-btn {
  padding: 10px 28px;
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: transparent;
  color: var(--accent);
  font-size: 15px; cursor: pointer;
  transition: all 0.2s;
}
.welcome-btn:hover { background: var(--accent); color: #fff; }

/* ========== 拖拽提示 ========== */
.drop-overlay {
  position: fixed; inset: 0;
  background: rgba(139,115,85,0.15);
  border: 3px dashed var(--accent);
  z-index: 500;
  display: none;
  align-items: center; justify-content: center;
  font-size: 18px; color: var(--accent);
}
.drop-overlay.visible { display: flex; }

/* ========== 自动滚动指示器 ========== */
.autoscroll-indicator {
  position: fixed; bottom: 48px; left: 50%;
  transform: translateX(-50%);
  padding: 6px 16px;
  background: var(--accent);
  color: #fff; border-radius: 20px;
  font-size: 12px; z-index: 90;
  display: none; gap: 8px; align-items: center;
}
.autoscroll-indicator.visible { display: flex; }
.autoscroll-indicator button {
  border: none; background: rgba(255,255,255,0.2);
  color: #fff; border-radius: 50%;
  width: 24px; height: 24px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}

/* ========== Toast 提示 ========== */
.toast {
  position: fixed; bottom: 60px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  padding: 8px 20px;
  background: var(--text-primary);
  color: var(--bg-primary);
  border-radius: 8px;
  font-size: 13px;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
}
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ========== 模式切换按钮组 ========== */
.mode-group {
  display: flex; gap: 2px;
  background: var(--border-color);
  border-radius: 6px; padding: 2px;
}
.mode-btn {
  padding: 4px 10px;
  border: none; background: transparent;
  color: var(--text-muted); font-size: 12px;
  cursor: pointer; border-radius: 4px;
  transition: all 0.2s;
}
.mode-btn.active { background: var(--bg-primary); color: var(--text-primary); box-shadow: 0 1px 3px var(--shadow); }

/* ========== 隐藏 file input ========== */
.hidden-input { display: none; }

/* ========== 背景图片层 ========== */
.bg-image-layer {
  position: fixed; inset: 0;
  z-index: -1;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* ========== PDF 渲染 ========== */
.pdf-page-img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 0 auto 12px;
  box-shadow: 0 2px 8px var(--shadow);
}

/* ========== 响应式 - 移动端 (<768px) ========== */
@media (max-width: 767px) {
  :root { --content-width: 100vw; --sidebar-width: 100vw; --topbar-height: 44px; --bottombar-height: 0px; }
  html, body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .content-wrapper { padding: 12px 10px; }
  /* 修复移动端三点菜单：顶栏 z-index 确保按钮在菜单之上 */
  .topbar { padding: 0 8px; z-index: 999; position: relative; }
  .file-name { max-width: 100px; font-size: 12px; }

  /* 【移动端】工具栏：隐藏次要按钮，显示"更多"按钮 */
  .topbar-right .mobile-hide { display: none !important; }
  .topbar-right .mobile-show { display: flex !important; }

  /* 修复移动端三点菜单：按钮用 class 选择器确保特异性一致 */
  #btnMore {
    display: flex !important;
    position: relative;
    z-index: 10001;
    width: 44px;
    height: 44px;
  }

  /* 【移动端】图标按钮触摸目标 ≥ 44px */
  .icon-btn { width: 40px; height: 40px; }
  .icon-btn svg { width: 20px; height: 20px; }

  /* 【移动端】侧边栏全屏覆盖 */
  .sidebar { width: 100vw; max-width: 100vw; border-radius: 0; }
  .sidebar-header { height: 48px; padding: 0 12px; }
  .sidebar-header h3 { font-size: 16px; }

  /* 【移动端】底部状态栏隐藏（改用浮动翻页箭头+胶囊页码） */
  .bottombar { display: none; }

  /* 【删除】移动端浮动翻页箭头样式（已移除） */
/*
  .mobile-page-nav { display: flex !important; }
  .mobile-page-arrow { ... }
  .mobile-page-capsule { ... }
*/

  /* 【移动端】搜索栏全宽 */
  .search-bar { height: auto; flex-wrap: wrap; padding: 8px 10px; gap: 6px; }
  .search-bar input { font-size: 16px; min-width: 0; flex: 1 1 100%; }
  .search-bar .search-options { flex: 1 1 100%; flex-wrap: wrap; }
  .search-bar .search-info { min-width: auto; }

  /* 【移动端】设置面板改为底部弹出 */
  .settings-panel {
    top: auto; bottom: 0; left: 0; right: 0;
    width: 100vw; max-width: 100vw;

<script>
/* ================================================================
   沉浸阅读器 - 完整 JavaScript
   ================================================================ */

// ========== 工具函数 ==========
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);
const LS_PREFIX = 'reader_';

function lsGet(key, def) {
  try { const v = localStorage.getItem(LS_PREFIX + key); return v !== null ? JSON.parse(v) : def; }
  catch { return def; }
}
function lsSet(key, val) {
  try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(val)); } catch {}
}
function lsRemove(key) {
  try { localStorage.removeItem(LS_PREFIX + key); } catch {}
}

/** 简单哈希（用于文件唯一标识） */
function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  }
  return 'h' + Math.abs(h).toString(36);
}

/** 格式化文件大小 */
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

/** 格式化时间 */
function formatTime(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/** 显示 Toast */
function showToast(msg, duration = 2000) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('visible');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('visible'), duration);
}

// ========== 编码检测 ==========
function detectEncoding(buffer) {
  const bytes = new Uint8Array(buffer);
  // 检查 UTF-8 BOM
  if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
    return 'utf-8';
  }
  // 检查 UTF-16 LE BOM
  if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) return 'utf-16le';
  // 检查 UTF-16 BE BOM
  if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) return 'utf-16be';
  // 尝试 UTF-8 合法性检测
  let isUtf8 = true;
  let i = 0;
  while (i < bytes.length) {
    if (bytes[i] < 0x80) { i++; continue; }
    let seqLen = 0;
    if ((bytes[i] & 0xE0) === 0xC0) seqLen = 2;
    else if ((bytes[i] & 0xF0) === 0xE0) seqLen = 3;
    else if ((bytes[i] & 0xF8) === 0xF0) seqLen = 4;
    else { isUtf8 = false; break; }
    if (i + seqLen > bytes.length) { isUtf8 = false; break; }
    for (let j = 1; j < seqLen; j++) {
      if ((bytes[i + j] & 0xC0) !== 0x80) { isUtf8 = false; break; }
    }
    if (!isUtf8) break;
    i += seqLen;
  }
  return isUtf8 ? 'utf-8' : 'gbk';
}

function decodeBuffer(buffer, encoding) {
  if (encoding === 'utf-8' || encoding === 'auto') {
    const detected = encoding === 'auto' ? detectEncoding(buffer) : 'utf-8';
    if (detected === 'utf-8') {
      return new TextDecoder('utf-8').decode(buffer);
    }
    return new TextDecoder(detected).decode(buffer);
  }
  try {
    return new TextDecoder(encoding).decode(buffer);
  } catch {
    return new TextDecoder('gbk').decode(buffer);
  }
}

// ========== 应用状态 ==========
const state = {
  currentFile: null,        // { name, size, hash, text, type }
  readMode: 'page',         // page | scroll | auto
  currentPage: 0,
  totalPages: 0,
  pages: [],                // 分页后的文本数组
  toc: [],                  // 目录项 [{title, level, pageIndex, textOffset}]
  bookmarks: [],            // 书签 [{id, name, page, time, snippet}]
  nightMode: false,
  fullscreen: false,
  searchOpen: false,
  settingsOpen: false,
  sidebarOpen: null,        // 'toc' | 'bookmark' | 'bookshelf' | null
  autoScrolling: false,
  autoScrollSpeed: 2,
  autoScrollTimer: null,
  layout: 'left',           // left | right
  bgImage: null,
  bgOpacity: 50,
  pendingBookHash: null,
  // 【新增】文件维度颜色设置（切换文件时独立保存/恢复）

// ========== 初始化 ==========
function init() {
  loadPreferences();
  applyPreferences();
  applyLayout();
  bindEvents();
  updateModeButtons();
}

function loadPreferences() {
  const saved = lsGet('preferences', null);
  if (saved) Object.assign(state.settings, saved);
  state.nightMode = lsGet('nightMode', false);
  state.layout = lsGet('layout', 'left');
  state.readMode = lsGet('readMode', 'page');
  state.bgImage = lsGet('bgImage', null);
  state.bgOpacity = lsGet('bgOpacity', 50);
}

function savePreferences() {
  lsSet('preferences', state.settings);
  lsSet('nightMode', state.nightMode);
  lsSet('layout', state.layout);
  lsSet('readMode', state.readMode);
  lsSet('bgImage', state.bgImage);
  lsSet('bgOpacity', state.bgOpacity);
}

function applyPreferences() {
  const root = document.documentElement;
  root.style.setProperty('--font-size', state.settings.fontSize + 'px');
  root.style.setProperty('--line-height', state.settings.lineHeight);
  root.style.setProperty('--font-family', state.settings.fontFamily);
  root.style.setProperty('--content-width', state.settings.contentWidth + 'px');

  // 【修改】使用文件维度颜色设置
  const fc = state.fileColorSettings.fontColor;
  const bc = state.fileColorSettings.bgColor;
  const bo = state.fileColorSettings.bgOpacity;

  root.style.setProperty('--text-primary', fc);
  // 【新增】辅助文字自动调整为比正文略浅的同色系
  root.style.setProperty('--text-secondary', lightenColor(fc, 60));
  root.style.setProperty('--text-muted', lightenColor(fc, 100));

  if (!state.nightMode) {
    // 【修改】应用背景色 + 透明度混合
    const blendedBg = blendWithWhite(bc, bo);
    root.style.setProperty('--bg-primary', blendedBg);
    root.style.setProperty('--bg-secondary', adjustColor(blendedBg, -10));
    root.style.setProperty('--navbar-bg', blendedBg + 'D9');
  }

  // 夜间模式
  if (state.nightMode) {
    document.body.classList.add('night-mode');
    $('#btnNight').classList.add('active');
  }

  // 设置面板控件同步
  $('#setFont').value = state.settings.fontFamily;
  $('#setFontSize').value = state.settings.fontSize;
  $('#fontSizeVal').textContent = state.settings.fontSize + 'px';
  $('#setLineHeight').value = state.settings.lineHeight;
  $('#lineHeightVal').textContent = state.settings.lineHeight;
  $('#setContentWidth').value = state.settings.contentWidth;
  $('#contentWidthVal').textContent = state.settings.contentWidth + 'px';
  $('#setFontColor').value = fc;
  $('#setBgColor').value = bc;
  $('#setBgOpacity2').value = bo;
  $('#setEncoding').value = state.settings.encoding;

  // 【修改】同步字体颜色预设色块高亮
  syncColorPresetActive('#fontColorPresets', fc);
  // 【修改】同步背景颜色预设色块高亮
  syncColorPresetActive('#bgColorPresets', bc);

  // 【兼容保留】旧背景预设高亮
  $$('.bg-preset').forEach(el => {
    el.classList.toggle('active', el.dataset.color === state.settings.bgColor);
  });

  // 布局选项
  $$('.layout-option').forEach(el => {
    el.classList.toggle('active', el.dataset.layout === state.layout);
  });

  // 【修改】恢复背景图片状态
  if (state.bgImage) {
    $('#bgImageLayer').style.backgroundImage = `url(${state.bgImage})`;
    $('#bgImageLayer').style.opacity = (100 - state.bgOpacity) / 100;
    $('#bgOpacityRow').style.display = 'flex';
    $('#setBgOpacity').value = state.bgOpacity;
    $('#bgOpacityVal').textContent = state.bgOpacity + '%';
  }

  // 【新增】初始化搜索高亮对比度
  updateSearchHighlightContrast();
}

// 【新增】同步颜色预设色块的 active 状态
function syncColorPresetActive(containerSel, activeColor) {
  const container = document.querySelector(containerSel);
  if (!container) return;
  container.querySelectorAll('.color-preset').forEach(el => {
    el.classList.toggle('active', el.dataset.color.toUpperCase() === activeColor.toUpperCase());
  });
}

// 【新增】将颜色与白色按透明度混合（opacity: 100=原色, 10=接近白色）
function blendWithWhite(hex, opacityPercent) {
  hex = hex.replace('#', '');
  const alpha = Math.max(0.1, opacityPercent / 100);
  let r = parseInt(hex.substring(0, 2), 16);
  let g = parseInt(hex.substring(2, 4), 16);
  let b = parseInt(hex.substring(4, 6), 16);
  r = Math.round(r * alpha + 255 * (1 - alpha));
  g = Math.round(g * alpha + 255 * (1 - alpha));
  b = Math.round(b * alpha + 255 * (1 - alpha));
  return '#' + [r, g, b].map(c => Math.max(0, Math.min(255, c)).toString(16).padStart(2, '0')).join('');
}

// 【新增】将颜色变浅（用于辅助文字）
function lightenColor(hex, amount) {
  hex = hex.replace('#', '');
  let r = Math.min(255, parseInt(hex.substring(0, 2), 16) + amount);
  let g = Math.min(255, parseInt(hex.substring(2, 4), 16) + amount);
  let b = Math.min(255, parseInt(hex.substring(4, 6), 16) + amount);
  return '#' + [r, g, b].map(c => c.toString(16).padStart(2, '0')).join('');
}

function adjustColor(hex, amount) {
  hex = hex.replace('#', '');
  let r = Math.max(0, Math.min(255, parseInt(hex.substring(0, 2), 16) + amount));
  let g = Math.max(0, Math.min(255, parseInt(hex.substring(2, 4), 16) + amount));
  let b = Math.max(0, Math.min(255, parseInt(hex.substring(4, 6), 16) + amount));
  return '#' + [r, g, b].map(c => c.toString(16).padStart(2, '0')).join('');
}

function applyLayout() {
  const isRight = state.layout === 'right';
  // 侧边栏方向
  ['tocSidebar', 'bookmarkSidebar', 'bookshelfSidebar'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.toggle('right-layout', isRight);
  });
  // 设置面板方向
  $('#settingsPanel').classList.toggle('right-layout', isRight);
  // 顶栏按钮位置
  const leftContainer = $('#topbarLeft');
  const rightContainer = $('.topbar-right');
  // 移动功能按钮
  const funcBtns = leftContainer.querySelectorAll('.func-btn');
  funcBtns.forEach(btn => {
    if (isRight) {
      rightContainer.insertBefore(btn, rightContainer.firstChild);
    } else {
      leftContainer.appendChild(btn);
    }
  });
}

// ========== 文件处理 ==========

// 【修复】处理文件选择事件
async function handleFileSelect(e) {
  const files = Array.from(e.target.files);
  if (files.length === 0) return;
  
  // 【修复】如果是在书架面板中点击添加书籍
  if (state.sidebarOpen === 'bookshelf' && !state.pendingBookHash) {
    addFilesToBookshelf(files);
    e.target.value = '';
    return;
  }
  
  // 【修复】检查是否是书架点击后触发的文件选择
  const file = files[0];
  const fileHash = simpleHash(file.name + file.size);
  
  // 如果有待打开的书籍哈希，验证是否匹配
  if (state.pendingBookHash && state.pendingBookHash !== fileHash) {
    showToast('文件不匹配，请选择与书架中对应的文件');
    state.pendingBookHash = null;
    e.target.value = '';
    return;
  }
  
  await loadFile(file);
  e.target.value = '';
  state.pendingBookHash = null;
}

// 【修复】主文件加载函数
async function loadFile(file) {
  const hash = simpleHash(file.name + file.size);
  const fileInfo = { name: file.name, size: file.size, hash, type: file.name.endsWith('.pdf') ? 'pdf' : 'txt' };

  if (fileInfo.type === 'pdf') {
    showToast('PDF 支持需要 pdf.js，当前以文本方式尝试读取');
  }

  let text;
  try {
    const buffer = await file.arrayBuffer();
    const encoding = state.settings.encoding === 'auto' ? detectEncoding(buffer) : state.settings.encoding;
    text = decodeBuffer(buffer, encoding);
    fileInfo.text = text;
  } catch (err) {
    showToast('文件读取失败: ' + err.message);
    console.error('文件读取错误:', err);
    return;
  }

  // 【修复】设置当前文件
  state.currentFile = fileInfo;
  $('#fileName').textContent = file.name;

  // 【修复】加载该文件的进度和书签
  loadFileData(hash);

  // 【新增】加载该文件的颜色设置（按文件维度独立存储）
  loadFileColorSettings(hash);

  // 【修复】处理文本
  processText(text);

  // 【修复】生成目录
  generateTOC(text);

  // 【修复】渲染内容
  renderContent();

  // 【修复】恢复进度
  restoreProgress();

  // 【修复】更新书架
  updateBookshelfEntry(fileInfo);

  // 【修复】关闭面板
  closeAllSidebars();
  closeSearch();
  closeSettings();

  showToast('已打开: ' + file.name);
}

function processText(text) {
  // 统一换行符
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  // 按段落分割
  let paragraphs = text.split(/\n+/).filter(p => p.trim());
  // 如果全部是空白，至少保留一个空段落以避免崩溃
  if (paragraphs.length === 0) {
    paragraphs = [text.trim() || '(空白内容)'];
  }
  state.rawParagraphs = paragraphs;
  state.fullText = text;
}

function renderContent() {
  const wrapper = $('#contentWrapper');
  wrapper.innerHTML = '';

  if (state.readMode === 'page') {
    wrapper.className = 'content-wrapper page-mode';
    paginateContent();
    state.pages.forEach((pageText, i) => {
      const div = document.createElement('div');
      div.className = 'page-content' + (i === state.currentPage ? ' active' : '');
      div.dataset.page = i;
      div.innerHTML = pageText;
      wrapper.appendChild(div);
    });
    updateStatus();
  } else {
    wrapper.className = 'content-wrapper scroll-mode';
    const div = document.createElement('div');
    div.className = 'page-content active';
    div.innerHTML = state.rawParagraphs.map(p => `<p class="para">${escapeHtml(p)}</p>`).join('');
    wrapper.appendChild(div);
    // 恢复滚动位置
    const scrollPos = lsGet('scroll_' + state.currentFile.hash, 0);
    setTimeout(() => {
      $('#readerContent').scrollTop = scrollPos * $('#readerContent').scrollHeight;
    }, 50);
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ========== 分页 ==========
function paginateContent() {
  const wrapper = $('#contentWrapper');
  const contentEl = $('#readerContent');
  
  // 计算可用高度，确保为正数
  const totalHeight = contentEl.clientHeight || (window.innerHeight - 40 - 32);
  const containerHeight = Math.max(200, totalHeight - 48); // 减去上下 padding，最小200px
  
  // 临时渲染全部文本以测量
  wrapper.innerHTML = '';
  const tempDiv = document.createElement('div');
  tempDiv.className = 'page-content active';
  tempDiv.style.cssText = 'visibility:hidden;position:absolute;width:' + ($('#contentWrapper').offsetWidth || 680) + 'px;';
  tempDiv.innerHTML = state.rawParagraphs.map(p => `<p class="para">${escapeHtml(p)}</p>`).join('');
  document.body.appendChild(tempDiv);
  
  const pages = [];
  let currentPage = [];
  const paras = tempDiv.querySelectorAll('.para');
  
  paras.forEach(p => {
    currentPage.push(p.outerHTML);
    const tempPage = document.createElement('div');
    tempPage.style.cssText = 'visibility:hidden;position:absolute;width:' + ($('#contentWrapper').offsetWidth || 680) + 'px;';
    tempPage.innerHTML = currentPage.join('');
    document.body.appendChild(tempPage);
    if (tempPage.offsetHeight > containerHeight && currentPage.length > 1) {
      currentPage.pop();
      pages.push(currentPage.join(''));
      currentPage = [p.outerHTML];
    }
    document.body.removeChild(tempPage);
  });
  if (currentPage.length > 0) pages.push(currentPage.join(''));
  
  // 清理临时元素
  if (document.body.contains(tempDiv)) {
    document.body.removeChild(tempDiv);
  }
  
  state.pages = pages;
  state.totalPages = pages.length;
  if (state.currentPage >= state.totalPages) state.currentPage = state.totalPages - 1;
  if (state.currentPage < 0) state.currentPage = 0;
}

// ========== 阅读模式切换 ==========
function switchReadMode(mode) {
  state.readMode = mode;
  savePreferences();
  updateModeButtons();

  if (mode === 'auto') {
    startAutoScroll();
  } else {
    stopAutoScroll();
  }

  if (state.currentFile) {
    // 保存当前进度
    saveProgress();
    renderContent();
    restoreProgress();
  }
}

function updateModeButtons() {
  $$('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === state.readMode);
  });
  $('#autoscrollIndicator').classList.toggle('visible', state.readMode === 'auto');
  // 【删除】移动端浮动翻页箭头/胶囊显示逻辑（已移除）
  // const isMobile = window.innerWidth < 768;
  // if (nav) nav.style.display = ...
}

// ========== 状态栏更新 ==========
function updateStatus() {
  if (!state.currentFile) {
    $('#statusInfo').textContent = '-- / --';
    $('#statusPercent').textContent = '--%';
    return;
  }
  if (state.readMode === 'page') {
    $('#statusInfo').textContent = `${state.currentPage + 1} / ${state.totalPages}`;
    const pct = state.totalPages > 0 ? Math.round(((state.currentPage + 1) / state.totalPages) * 100) : 0;
    $('#statusPercent').textContent = pct + '%';
  } else {
    const el = $('#readerContent');
    const pct = el.scrollHeight > el.clientHeight ? Math.round((el.scrollTop / (el.scrollHeight - el.clientHeight)) * 100) : 100;
    $('#statusInfo').textContent = '';
    $('#statusPercent').textContent = pct + '%';
  }
}

// ========== 翻页 ==========
function goToPage(pageIndex) {
  if (pageIndex < 0) pageIndex = 0;
  if (pageIndex >= state.totalPages) pageIndex = state.totalPages - 1;
  state.currentPage = pageIndex;

  $$('.page-content').forEach((el, i) => {
    el.classList.toggle('active', i === pageIndex);
  });
  updateStatus();
  saveProgress();
  updateBookmarkIcon();
  updateCurrentTOC();
}

function prevPage() { goToPage(state.currentPage - 1); }
function nextPage() { goToPage(state.currentPage + 1); }

// ========== 滚动处理 ==========
function handleScroll() {
  if (state.readMode !== 'page' && state.readMode !== 'auto') {
    updateStatus();
  }
  // 节流保存滚动进度
  clearTimeout(handleScroll._timer);
  handleScroll._timer = setTimeout(() => {
    if (state.currentFile && state.readMode !== 'page') {
      const el = $('#readerContent');
      const pct = el.scrollHeight > el.clientHeight ? el.scrollTop / (el.scrollHeight - el.clientHeight) : 0;
      lsSet('scroll_' + state.currentFile.hash, pct);
    }
  }, 500);
}

// ========== 自动滚动 ==========
function startAutoScroll() {
  state.autoScrolling = true;
  $('#autoScrollToggle').textContent = '⏸';
  doAutoScroll();
}

function stopAutoScroll() {
  state.autoScrolling = false;
  $('#autoScrollToggle').textContent = '▶';
  if (state.autoScrollTimer) {
    cancelAnimationFrame(state.autoScrollTimer);
    state.autoScrollTimer = null;
  }
}

function toggleAutoScroll() {
  if (state.autoScrolling) stopAutoScroll();
  else startAutoScroll();
}

function doAutoScroll() {
  if (!state.autoScrolling) return;
  const el = $('#readerContent');
  el.scrollTop += state.autoScrollSpeed * 0.5;
  if (el.scrollTop >= el.scrollHeight - el.clientHeight) {
    stopAutoScroll();
    return;
  }
  state.autoScrollTimer = requestAnimationFrame(doAutoScroll);
}

function changeAutoScrollSpeed(delta) {
  state.autoScrollSpeed = Math.max(0.5, Math.min(10, state.autoScrollSpeed + delta));
  $('#autoScrollSpeed').textContent = state.autoScrollSpeed;
}

// ========== 搜索 ==========
function toggleSearch() {
  state.searchOpen = !state.searchOpen;
  $('#searchBar').classList.toggle('visible', state.searchOpen);
  if (state.searchOpen) {
    $('#searchInput').focus();
  } else {
    closeSearch();
  }
}

function closeSearch() {
  state.searchOpen = false;
  $('#searchBar').classList.remove('visible');
  clearHighlights();
  state.searchMatches = [];
  state.searchCurrentIndex = -1;
  $('#searchInfo').textContent = '';
  $('#searchInput').value = '';
}

function performSearch() {
  clearHighlights();
  const query = $('#searchInput').value.trim();
  if (!query || !state.currentFile) {
    state.searchMatches = [];
    state.searchCurrentIndex = -1;
    $('#searchInfo').textContent = '';
    return;
  }

  const caseSensitive = $('#searchCaseSensitive').checked;
  const wholeWord = $('#searchWholeWord').checked;

  // 构建正则
  let pattern = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  if (wholeWord) pattern = `\\b${pattern}\\b`;
  const flags = caseSensitive ? 'g' : 'gi';
  const regex = new RegExp(pattern, flags);

  // 在当前页或全部文本中搜索
  state.searchMatches = [];
  state.searchCurrentIndex = -1;

  // 在所有可见内容中搜索
  const contentEls = $$('.page-content.active, .scroll-mode .page-content');
  contentEls.forEach(el => {
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    const textNodes = [];
    while (walker.nextNode()) textNodes.push(walker.currentNode);

    textNodes.forEach(node => {
      const text = node.textContent;
      let match;
      regex.lastIndex = 0;
      while ((match = regex.exec(text)) !== null) {
        state.searchMatches.push({ node, index: match.index, length: match[0].length });
      }
    });
  });

  if (state.searchMatches.length > 0) {
    state.searchCurrentIndex = 0;
    highlightMatches();
    $('#searchInfo').textContent = `第 1 / 共 ${state.searchMatches.length} 个`;
  } else {
    // 尝试翻页查找
    if (state.readMode === 'page') {
      let found = false;
      for (let i = 0; i < state.totalPages; i++) {
        if (i === state.currentPage) continue;
        const pageText = state.pages[i] || '';
        const testRegex = new RegExp(pattern, flags);
        if (testRegex.test(pageText)) {
          goToPage(i);
          setTimeout(() => performSearch(), 100);
          found = true;
          break;
        }
      }
      if (!found) {
        $('#searchInfo').textContent = '无匹配';
      }
    } else {
      $('#searchInfo').textContent = '无匹配';
    }
  }
}

function highlightMatches() {
  clearHighlights();
  if (state.searchMatches.length === 0) return;

  // 按节点分组，从后往前替换避免偏移
  const byNode = new Map();
  state.searchMatches.forEach((m, idx) => {
    if (!byNode.has(m.node)) byNode.set(m.node, []);
    byNode.get(m.node).push({ ...m, globalIdx: idx });
  });

  byNode.forEach((matches, node) => {
    // 从后往前处理
    matches.sort((a, b) => b.index - a.index);
    const parent = node.parentNode;
    matches.forEach(m => {
      const range = document.createRange();
      range.setStart(node, m.index);
      range.setEnd(node, m.index + m.length);
      const span = document.createElement('span');
      span.className = 'search-highlight' + (m.globalIdx === state.searchCurrentIndex ? ' current' : '');
      range.surroundContents(span);
    });
  });

  // 滚动到当前匹配
  const current = document.querySelector('.search-highlight.current');
  if (current) current.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function clearHighlights() {
  $$('.search-highlight').forEach(el => {
    const parent = el.parentNode;
    parent.replaceChild(document.createTextNode(el.textContent), el);
    parent.normalize();
  });
}

function navigateSearch(direction) {
  if (state.searchMatches.length === 0) return;
  state.searchCurrentIndex += direction;
  if (state.searchCurrentIndex < 0) state.searchCurrentIndex = state.searchMatches.length - 1;
  if (state.searchCurrentIndex >= state.searchMatches.length) state.searchCurrentIndex = 0;
  highlightMatches();
  $('#searchInfo').textContent = `第 ${state.searchCurrentIndex + 1} / 共 ${state.searchMatches.length} 个`;
}

// ========== 目录 ==========
function generateTOC(text) {
  state.toc = [];
  const lines = text.split('\n');
  const patterns = [
    { regex: /^(第[零一二三四五六七八九十百千万\d]+[章节回卷集部篇])/g, level: 0 },
    { regex: /^(\d{1,4}[.、]\s*\d{0,2}[.、]?\s*\d{0,2}[.、]?\s*.+)/g, level: 1 },
    { regex: /^(前言|引言|序[言章]?|楔子|尾声|后记|附录|番外|引子|代序|自序|编者按)/g, level: 0 },
    { regex: /^(Chapter\s+\d+|CHAPTER\s+\d+)/gi, level: 0 },
    { regex: /^(卷[零一二三四五六七八九十百千万\d]+|VOL\.\s*\d+)/gi, level: 0 }
  ];

  let paraIndex = 0;
  lines.forEach((line, lineIdx) => {
    const trimmed = line.trim();
    if (!trimmed) return;
    for (const p of patterns) {
      p.regex.lastIndex = 0;
      if (p.regex.test(trimmed)) {
        // 计算段落索引
        const pageIndex = estimatePageIndex(paraIndex);
        state.toc.push({
          title: trimmed,
          level: p.level,
          pageIndex,
          paraIndex,
          lineIndex: lineIdx
        });
        break;
      }
    }
    paraIndex++;
  });
}

function estimatePageIndex(paraIndex) {
  // 粗略估算：基于段落总数和每页大概段落数
  if (state.totalPages > 0) {
    const parasPerPage = state.rawParagraphs.length / state.totalPages;
    return Math.min(Math.floor(paraIndex / Math.max(1, parasPerPage)), state.totalPages - 1);
  }
  return 0;
}

function renderTOC() {
  const list = $('#tocList');
  if (state.toc.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:40px 0;font-size:14px;">未检测到目录</div>';
    return;
  }
  list.innerHTML = state.toc.map((item, i) => `
    <div class="toc-item indent-${item.level}" data-index="${i}" data-page="${item.pageIndex}" data-para="${item.paraIndex}">
      <span class="toc-level">${item.level === 0 ? '●' : '○'}</span>
      <span>${escapeHtml(item.title)}</span>
    </div>
  `).join('');

  list.querySelectorAll('.toc-item').forEach(el => {
    el.addEventListener('click', () => {
      const page = parseInt(el.dataset.page);
      if (state.readMode === 'page') {
        goToPage(page);
      } else {
        // 滚动到对应段落
        const paraIdx = parseInt(el.dataset.para);
        const paras = $$('.page-content .para');
        if (paras[paraIdx]) {
          paras[paraIdx].scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
      closeAllSidebars();
    });
  });

  updateCurrentTOC();
}

function updateCurrentTOC() {
  if (state.toc.length === 0) return;
  const currentPara = state.readMode === 'page'
    ? estimateCurrentPara(state.currentPage)
    : estimateCurrentParaFromScroll();

  let currentIdx = 0;
  for (let i = state.toc.length - 1; i >= 0; i--) {
    if (state.toc[i].paraIndex <= currentPara) {
      currentIdx = i;
      break;
    }
  }
  $$('.toc-item').forEach((el, i) => {
    el.classList.toggle('current', i === currentIdx);
  });
}

function estimateCurrentPara(pageIndex) {
  if (state.totalPages <= 0 || !state.rawParagraphs) return 0;
  const parasPerPage = state.rawParagraphs.length / state.totalPages;
  return Math.floor(pageIndex * parasPerPage);
}

function estimateCurrentParaFromScroll() {
  const el = $('#readerContent');
  const paras = $$('.page-content .para');
  if (paras.length === 0) return 0;
  const scrollRatio = el.scrollTop / (el.scrollHeight - el.clientHeight || 1);
  return Math.floor(scrollRatio * paras.length);
}

function getBookshelf() {
  return lsGet('bookshelf', []);
}

function saveBookshelf(shelf) {
  lsSet('bookshelf', shelf);
}

function addFilesToBookshelf(files) {
  const shelf = getBookshelf();
  let added = 0;
  files.forEach(file => {
    const hash = simpleHash(file.name + file.size);
    if (!shelf.find(b => b.hash === hash)) {
      shelf.push({
        name: file.name,
        size: file.size,
        hash,
        lastRead: null,
        progress: 0
      });
      added++;
    }
  });
  saveBookshelf(shelf);
  renderBookshelf();
  showToast(`已添加 ${added} 本书籍`);
}

function updateBookshelfEntry(fileInfo) {
  const shelf = getBookshelf();
  const entry = shelf.find(b => b.hash === fileInfo.hash);
  if (entry) {
    entry.lastRead = Date.now();
    entry.progress = state.readMode === 'page'
      ? (state.totalPages > 0 ? (state.currentPage + 1) / state.totalPages : 0)
      : 0;
    saveBookshelf(shelf);
  } else {
    shelf.push({
      name: fileInfo.name,
      size: fileInfo.size,
      hash: fileInfo.hash,
      lastRead: Date.now(),
      progress: state.totalPages > 0 ? (state.currentPage + 1) / state.totalPages : 0
    });
    saveBookshelf(shelf);
  }
}

// 【修复】书架渲染和点击事件
function renderBookshelf() {
  const shelf = getBookshelf();
  const list = $('#bookshelfList');
  if (shelf.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:40px 0;font-size:14px;">书架空空如也<br>点击 + 添加书籍</div>';
    return;
  }
  list.innerHTML = shelf.map((book, i) => `
    <div class="bookshelf-item" data-index="${i}" data-hash="${book.hash}" data-name="${escapeHtml(book.name)}">
      <div class="bs-name">${escapeHtml(book.name)}</div>
      <div class="bs-meta">
        <span>${formatSize(book.size)}</span>
        <span>${book.lastRead ? formatTime(book.lastRead) : '未阅读'}</span>
      </div>
      <div class="bs-progress"><div class="bs-progress-bar" style="width:${Math.round(book.progress * 100)}%"></div></div>
      <button class="bs-delete" data-index="${i}">删除</button>
    </div>
  `).join('');

  // 【修复】点击打开书籍 - 触发文件选择器
  list.querySelectorAll('.bookshelf-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.classList.contains('bs-delete')) return;
      
      // 【修复】获取书籍信息并触发文件选择
      const bookHash = el.dataset.hash;
      const bookName = el.dataset.name;
      
      // 设置待打开的书籍哈希
      state.pendingBookHash = bookHash;
      
      // 提示用户选择文件
      showToast(`请选择文件: ${bookName}`, 3000);
      
      // 延迟触发文件选择器
      setTimeout(() => {
        $('#fileInput').click();
      }, 500);
    });
  });

  // 删除按钮
  list.querySelectorAll('.bs-delete').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.index);
      const shelf = getBookshelf();
      const name = shelf[idx].name;
      shelf.splice(idx, 1);
      saveBookshelf(shelf);
      renderBookshelf();
      showToast(`已移除: ${name}`);
    });
  });

  // 左滑删除
  let touchStartX = 0;
  list.querySelectorAll('.bookshelf-item').forEach(el => {
    el.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      el.classList.remove('swiped');
    });
    el.addEventListener('touchmove', (e) => {
      const dx = e.touches[0].clientX - touchStartX;
      if (dx < -40) el.classList.add('swiped');
      else el.classList.remove('swiped');
    });
    el.addEventListener('touchend', () => {
      setTimeout(() => el.classList.remove('swiped'), 2000);
    });
  });
}

// 【新增】根据字体颜色自动调整搜索高亮对比度
function updateSearchHighlightContrast() {
  const fc = state.fileColorSettings.fontColor.toUpperCase();
  const root = document.documentElement;
  
  // 如果字体颜色接近黄色（与高亮冲突），调整高亮色
  const isYellowish = isColorClose(fc, '#FFEB3B') || isColorClose(fc, '#FFC107') || isColorClose(fc, '#FFD700');
  const isOrangish = isColorClose(fc, '#FF9800') || isColorClose(fc, '#FF5722');
  
  if (isYellowish) {
    // 字体为黄色系 → 高亮改为蓝绿色系
    root.style.setProperty('--highlight', '#26C6DA');
    root.style.setProperty('--highlight-current', '#00838F');
  } else if (isOrangish) {
    // 字体为橙色系 → 高亮改为绿色系
    root.style.setProperty('--highlight', '#66BB6A');
    root.style.setProperty('--highlight-current', '#2E7D32');
  } else {
    // 默认高亮色
    root.style.setProperty('--highlight', '#FFEB3B');
    root.style.setProperty('--highlight-current', '#FF9800');
  }
}

// 【新增】判断两个颜色是否接近（欧几里得距离）
function isColorClose(hex1, hex2, threshold = 100) {
  hex1 = hex1.replace('#', '');
  hex2 = hex2.replace('#', '');
  const r1 = parseInt(hex1.substring(0, 2), 16), g1 = parseInt(hex1.substring(2, 4), 16), b1 = parseInt(hex1.substring(4, 6), 16);
  const r2 = parseInt(hex2.substring(0, 2), 16), g2 = parseInt(hex2.substring(2, 4), 16), b2 = parseInt(hex2.substring(4, 6), 16);
  const dist = Math.sqrt((r1-r2)**2 + (g1-g2)**2 + (b1-b2)**2);
  return dist < threshold;
}

// ========== 全屏 ==========
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

// ========== 背景图片 ==========
function handleBgImageUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    state.bgImage = reader.result;
    // 【修改】背景图片作为叠加层，背景色作为底层
    $('#bgImageLayer').style.backgroundImage = `url(${state.bgImage})`;
    $('#bgImageLayer').style.opacity = (100 - state.bgOpacity) / 100;
    $('#bgOpacityRow').style.display = 'flex';
    savePreferences();
    showToast('背景图已设置');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

// 【新增】清除背景图片（恢复纯色背景）
function clearBgImage() {
  state.bgImage = null;
  $('#bgImageLayer').style.backgroundImage = '';
  $('#bgImageLayer').style.opacity = '0';
  $('#bgOpacityRow').style.display = 'none';
  savePreferences();
  showToast('背景图已清除');
}

// ========== 进度保存/恢复 ==========
function saveProgress() {
  if (!state.currentFile) return;
  if (state.readMode === 'page') {
    lsSet('page_' + state.currentFile.hash, state.currentPage);
  }
}

function restoreProgress() {
  if (!state.currentFile) return;
  if (state.readMode === 'page') {
    const savedPage = lsGet('page_' + state.currentFile.hash, 0);
    if (savedPage < state.totalPages) {
      goToPage(savedPage);
    }
  }
  updateBookmarkIcon();
}

// ========== 键盘快捷键 ==========
function handleKeyboard(e) {
  // 搜索框内
  if (e.target.id === 'searchInput') {
    if (e.key === 'Enter') {
      e.preventDefault();
      navigateSearch(e.shiftKey ? -1 : 1);
    }
    if (e.key === 'Escape') closeSearch();
    return;
  }

  // 设置面板内
  if (state.settingsOpen && e.key === 'Escape') {
    closeSettings();
    return;
  }

  switch (e.key) {
    case 'ArrowLeft':
    case 'ArrowUp':
      if (state.readMode === 'page') { e.preventDefault(); prevPage(); }
      break;
    case 'ArrowRight':
    case 'ArrowDown':
    case ' ':
      if (state.readMode === 'page') { e.preventDefault(); nextPage(); }
      break;
    case 'Home':
      if (state.readMode === 'page') { e.preventDefault(); goToPage(0); }
      break;
    case 'End':
      if (state.readMode === 'page') { e.preventDefault(); goToPage(state.totalPages - 1); }
      break;
    case 'f':
    case 'F':
      if (e.ctrlKey || e.metaKey) { e.preventDefault(); toggleSearch(); }
      break;
    case 'Escape':
      closeSearch();
      closeSettings();
      closeAllSidebars();
      break;
  }
}

// ========== 点击空白区域 ==========
function handleBlankClick(e) {
  // 排除交互元素
  const tag = e.target.tagName;
  if (['BUTTON', 'INPUT', 'SELECT', 'TEXTAREA', 'A', 'LABEL', 'OPTION'].includes(tag)) return;
  if (e.target.closest('.icon-btn') || e.target.closest('.sidebar') ||
      e.target.closest('.settings-panel') || e.target.closest('.search-bar') ||
      e.target.closest('.bottombar') || e.target.closest('.topbar') ||
      e.target.closest('.welcome-screen') || e.target.closest('.autoscroll-indicator') ||
      e.target.closest('.drop-overlay') || e.target.closest('.mode-group') ||
      e.target.closest('.bookmark-item') || e.target.closest('.bookshelf-item') ||
      e.target.closest('.toc-item') || e.target.closest('.bg-preset') ||
      e.target.closest('.layout-option') ||
      e.target.closest('.mobile-page-nav') || e.target.closest('.mobile-page-capsule') ||
      e.target.closest('.mobile-more-menu')) return;

  // 检测是否为拖选（有选中文字则忽略）
  if (window.getSelection() && window.getSelection().toString().length > 0) return;

  // 按优先级关闭
  if (state.searchOpen) { closeSearch(); return; }
  if (state.settingsOpen) { closeSettings(); return; }
  if (state.sidebarOpen) { closeAllSidebars(); return; }
  if (state.fullscreen) { document.exitFullscreen().catch(() => {}); return; }
}

// ========== 窗口大小变化时重新分页 ==========
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (state.currentFile && state.readMode === 'page') {
      const currentPage = state.currentPage;
      paginateContent();
      renderContent();
      if (currentPage < state.totalPages) goToPage(currentPage);
    }
  }, 300);
});

// ========== 启动 ==========
init();

// ========== 【新增】移动端响应式逻辑 ==========
// ========== 修复移动端三点菜单：彻底重写，简化逻辑，使用原生JS避免 jQuery 冲突 ==========

var _menuOpen = false;
var _menuEl = null;
var _btnMoreEl = null;

function getMenuEl() { if (!_menuEl) _menuEl = document.getElementById('mobileMoreMenu'); return _menuEl; }
function getBtnMoreEl() { if (!_btnMoreEl) _btnMoreEl = document.getElementById('btnMore'); return _btnMoreEl; }

function openMobileMenu() {
  var menu = getMenuEl();
  if (menu) { menu.classList.add('visible'); }
  document.body.style.overflow = 'hidden';
  _menuOpen = true;
}
function closeMobileMenu() {
  var menu = getMenuEl();
  if (menu) { menu.classList.remove('visible'); }
  document.body.style.overflow = '';
  _menuOpen = false;
}
function toggleMobileMenu(e) {
  if (e) { e.stopPropagation(); e.preventDefault(); }
  if (_menuOpen) { closeMobileMenu(); } else { openMobileMenu(); }
}

// 绑定三点按钮事件（click 和 touchend）
var btnMore = getBtnMoreEl();
if (btnMore) {
  btnMore.addEventListener('click', toggleMobileMenu);
  btnMore.addEventListener('touchend', function(e) {
    e.preventDefault();
    e.stopPropagation();
    toggleMobileMenu(null);
  });
  // 明确设置 pointer-events
  btnMore.style.pointerEvents = 'auto';
  btnMore.style.cursor = 'pointer';
}

// 菜单项按钮事件
var mmConfig = [
  ['mmBookmark', toggleBookmark],
  ['mmSettings', toggleSettings],
  ['mmFullscreen', toggleFullscreen],
  ['mmNight', toggleNightMode]
];
mmConfig.forEach(function(cfg) {
  var el = document.getElementById(cfg[0]);
  if (el) {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      e.stopImmediatePropagation();
      closeMobileMenu();
      cfg[1]();
    });
    el.addEventListener('touchend', function(e) {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      closeMobileMenu();
      cfg[1]();
    });
  }
});

// document 点击/touchend 关闭菜单
document.addEventListener('click', function(e) {
  if (!_menuOpen) return;
  var menu = getMenuEl();
  var btn = getBtnMoreEl();
  if (menu && !menu.contains(e.target) && btn && !btn.contains(e.target)) {
    closeMobileMenu();
  }
});
document.addEventListener('touchend', function(e) {
  if (!_menuOpen) return;
  var menu = getMenuEl();
  var btn = getBtnMoreEl();
  if (menu && !menu.contains(e.target) && btn && !btn.contains(e.target)) {
    closeMobileMenu();
  }
});

// 【删除】移动端浮动翻页箭头事件（已移除）
  // $('#mobilePrevPage').addEventListener(...);
  // $('#mobileNextPage').addEventListener(...);

// 【新增】触摸滑动翻页（分页模式下左右滑动）
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
const readerContent = $('#readerContent');

readerContent.addEventListener('touchstart', (e) => {
  if (state.readMode !== 'page') return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartTime = Date.now();
}, { passive: true });

readerContent.addEventListener('touchend', (e) => {
  if (state.readMode !== 'page') return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  // 水平滑动距离 > 50px，且水平位移 > 垂直位移，且时间 < 500ms
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 500) {
    if (dx < 0) nextPage(); // 左滑 → 下一页
    else prevPage();         // 右滑 → 上一页
  }
}, { passive: true });

// 【新增】移动端页码胶囊同步更新
const _origUpdateStatus = updateStatus;
// 【删除】移动端胶囊状态更新逻辑（已移除浮动翻页箭头）
window.updateStatus = function() {
  _origUpdateStatus();
};

// 【新增】移动端检测：根据屏幕宽度调整默认字号
function applyMobileDefaults() {
  if (window.innerWidth < 768) {
    // 仅在用户从未自定义过字号时调整（通过检查是否有文件级设置）
    if (!state.currentFile && state.settings.fontSize === 18) {
      state.settings.fontSize = 16;
      applyPreferences();
    }
  }
}
applyMobileDefaults();
window.addEventListener('resize', () => {
  clearTimeout(applyMobileDefaults._timer);
  applyMobileDefaults._timer = setTimeout(applyMobileDefaults, 300);
});
</script>
